# CI/CD Pipeline — Sistema de Posgrado UTN FRLP
# Se ejecuta en cada Push o Pull Request hacia main y develop

name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ──────────────────────────────────────────
  # JOB 1: Backend (FastAPI + Alembic + Pytest ≥70%)
  # ──────────────────────────────────────────
  backend:
    name: Backend · Migraciones, Tests y Cobertura
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgrado_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: postgrado_test
        options: >-
          --health-cmd "pg_isready -U postgrado_user -d postgrado_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg2://postgrado_user:test_password@localhost:5432/postgrado_test
      JWT_SECRET: development-only-secret-change-before-deploying
      ENVIRONMENT: development
      STORAGE_PATH: /tmp/postgrado-ci-storage

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias (Backend)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verificar sintaxis Python
        run: python -m compileall -q main.py src scripts tests

      - name: Ejecutar migraciones Alembic sobre PostgreSQL 16
        run: alembic upgrade head

      - name: Verificar ejecución idempotente del seed de desarrollo
        run: |
          python -m scripts.seed
          python -m scripts.seed

      - name: Ejecutar tests unitarios e integración con cobertura (≥70%)
        run: pytest --cov=src --cov-fail-under=70 --cov-report=term-missing --cov-report=xml

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage.xml

  # ──────────────────────────────────────────
  # JOB 2: Frontend (React + TypeScript + ESLint + Vite Build)
  # ──────────────────────────────────────────
  frontend:
    name: Frontend · Linting y Build de Producción
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (Frontend)
        run: npm ci

      - name: Ejecutar ESLint (Frontend)
        run: npm run lint

      - name: Build de Producción (TypeScript + Vite)
        env:
          VITE_API_URL: http://localhost:8000/api/v1
        run: npm run build
