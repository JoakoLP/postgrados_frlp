services:
  # PostgreSQL persiste sus datos en un volumen y reporta salud para ordenar el arranque.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgrado_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cambiar_en_produccion}
      POSTGRES_DB: ${DB_NAME:-postgrado_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - postgrados_network

  # API FastAPI. El volumen dedicado conserva los archivos subidos fuera del contenedor.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-postgrado_user}:${DB_PASSWORD:-cambiar_en_produccion}@db:5432/${DB_NAME:-postgrado_dev}}
      JWT_SECRET: ${JWT_SECRET:-cambiar_en_produccion_por_secreto_seguro_de_minimo_32_caracteres}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-8h}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      STORAGE_PATH: ${STORAGE_PATH:-/var/postgrado-storage}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@posgrado.frlp.utn.edu.ar}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-8000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - backend_uploads:/var/postgrado-storage
    networks:
      - postgrados_network

  # Servidor de desarrollo Vite; se publica en http://localhost:5173.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:5173"
    networks:
      - postgrados_network

  # SMTP simulado de desarrollo; UI disponible en http://localhost:8025.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - postgrados_network

volumes:
  # Datos de PostgreSQL y archivos adjuntos.
  postgres_data:
  backend_uploads:

networks:
  # Red interna compartida; los servicios se resuelven por nombre (por ejemplo, "db").
  postgrados_network:
    name: postgrados_network
    driver: bridge
